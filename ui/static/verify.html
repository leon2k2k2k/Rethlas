<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verify — Rethlas</title>
  <link rel="stylesheet" href="style.css">
  <script src="vendor/marked.min.js"></script>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [["\\(", "\\)"], ["$", "$"]],
        displayMath: [["\\[", "\\]"], ["$$", "$$"]],
        processEscapes: true
      },
      options: { skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"] },
      startup: {
        typeset: false,
        ready: () => {
          MathJax.startup.defaultReady();
          window.dispatchEvent(new Event("rethlas-mathjax-ready"));
        }
      }
    };
  </script>
  <script defer src="vendor/tex-chtml.js"></script>
</head>
<body>
  <main>
    <header class="topbar">
      <div>
        <h1>Ad-hoc verification</h1>
        <div class="meta-line">Submit a statement + proof to the verification agent and watch the referee.</div>
      </div>
      <nav class="actions">
        <a class="button" href="./">All Runs</a>
        <a class="button" href="jobs.html">Jobs</a>
      </nav>
    </header>
    <section class="detail" style="padding:18px">
      <div class="launch-field"><label for="statement">statement</label>
        <textarea id="statement" rows="6" placeholder="Theorem statement (markdown + TeX)"></textarea></div>
      <div class="launch-field"><label for="proof">proof</label>
        <textarea id="proof" rows="14" placeholder="Proof markdown"></textarea></div>
      <p><button class="button" id="submit" style="border-color:var(--accent);color:var(--accent-2)">Verify</button>
        <span class="refresh" id="status"></span></p>
    </section>
    <section id="outcome" class="transcript" style="max-width:none" hidden></section>
  </main>
  <script type="module" src="js/verify-page.js"></script>
</body>
</html>
