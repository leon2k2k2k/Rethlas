# Discover campaign: discovery -> triage -> promotion chain.
# Run:   python3 pipeline.py discover campaigns/unit_distance_discover_example.yaml
# This reuses the proven scripts/run_unit_distance_cot_pipeline.sh under the hood.
name: unit_distance_discover_example
mode: discover

problem_file: data/discrete_geometry/unit_distance_disproof.md
samples: 10
parallel: 2
model: gpt-5.5
reasoning_effort: xhigh
discovery_profile: unit_distance_transition

# Auto-loop flags (default off = generate the repair command but do not launch).
auto_launch_promotion: false
auto_promote_obstruction: false
auto_launch_obstruction: false
